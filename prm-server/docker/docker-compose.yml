version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: prm_db
    environment:
      POSTGRES_USER: prm_user
      POSTGRES_PASSWORD: prm_pass
      POSTGRES_DB: prm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prm_user -d prm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: prm_server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://prm_user:prm_pass@db:5432/prm_db
      JWT_SECRET_KEY: change-this-in-production
      JWT_ACCESS_TOKEN_TTL_MINUTES: 15
      JWT_REFRESH_TOKEN_TTL_DAYS: 7
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
